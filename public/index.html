<!DOCTYPE html>
<!--
    inphub lite: app shell.

    This file is a TEMPLATE. tools/build.mjs fills in the double-brace slots
    (the hashed CSS and entry paths, the app version and the build hash) and
    writes the result to public/index.html. Never edit public/index.html by
    hand; the next build overwrites it.

    Unlike inphub's index.php there is no server, so nothing here is rendered per
    user. The attributes on <html> are plain defaults and the pre-paint script
    below is the only thing that changes them before the app boots.
-->
<html lang="en" data-theme="dark" data-accent="blue" data-wallpaper="aurora" data-glass="full" data-logo="accent">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>inphub lite</title>
    <meta name="description" content="Personal life dashboard: money, tasks, habits, goals, notes, focus. Runs entirely in your browser.">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#0b0d12">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="inphub lite">

    <!-- Safari and older browsers ignore SVG favicons and fall back to /favicon.ico
         at the server root. The .ico/.png links stop that; ?v= busts the browser's
         long favicon cache on a redesign. Every path is relative, with no leading
         slash, because the site is served from /inphub-lite/ on GitHub Pages. -->
    <link rel="icon" href="icons/favicon.ico?v=3ea3410dce" sizes="32x32">
    <link rel="icon" href="icons/favicon.svg?v=3ea3410dce" type="image/svg+xml">
    <link rel="icon" href="icons/favicon-32.png?v=3ea3410dce" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=3ea3410dce">
    <link rel="manifest" href="manifest.webmanifest?v=3ea3410dce">

    <link rel="stylesheet" href="assets/css/app-U2OUFD4H.css">

    <script>
        // Apply the saved theme + appearance before first paint, so a reload never
        // flashes the default dark/aurora/blue at someone who picked light/forest.
        // In inphub this cache backed up the database; here it IS the source of
        // truth for the look, which is why it runs this early and why every read
        // is defensive (private mode and blocked site data both throw).
        //
        // First-run nicety: if lite has no saved look but inphub's keys exist on
        // this origin (i.e. both are being served from localhost), borrow them, so
        // lite opens already matching the look you picked in inphub.
        (function () {
            var h = document.documentElement;
            function read(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
            var t = read('inphub-lite:theme') || read('inphub.theme');
            if (t === 'light' || t === 'dark') {
                h.setAttribute('data-theme', t);
                var m = document.querySelector('meta[name="theme-color"]');
                if (m) m.setAttribute('content', t === 'light' ? '#f4f6fa' : '#0b0d12');
            }
            try {
                var a = JSON.parse(read('inphub-lite:appearance') || read('inphub.appearance') || 'null');
                if (a && typeof a === 'object') {
                    if (a.accent) h.setAttribute('data-accent', a.accent);
                    if (a.wallpaper) h.setAttribute('data-wallpaper', a.wallpaper);
                    if (a.transparency) h.setAttribute('data-glass', a.transparency);
                    if (a.logo) h.setAttribute('data-logo', a.logo);
                    if (a.image) h.style.setProperty('--wp-image', a.image);
                    else h.style.removeProperty('--wp-image');
                }
            } catch (e) {}
        })();
    </script>
</head>
<body>
    <div class="wallpaper" aria-hidden="true"></div>
    <div class="app">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="brand">
                <span class="logo">inphub</span><span class="logo-lite">lite</span>
                <span class="brand-version">v1.0.0</span>
            </div>
            <nav class="nav">
                <a href="#dashboard" class="nav-item" data-view="dashboard" data-key="d"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg><span class="nav-label">Dashboard</span></a>
                <a href="#todos" class="nav-item" data-view="todos" data-key="t"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6.5l1.6 1.6L8.8 5M4 12.5l1.6 1.6 3.2-3.1M4 18.5l1.6 1.6 3.2-3.1"/><path d="M12.5 7H20M12.5 13H20M12.5 19H20"/></svg><span class="nav-label">To-Do</span></a>
                <a href="#expenses" class="nav-item" data-view="expenses" data-key="e"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6.5" width="18" height="13.5" rx="3"/><path d="M3 10.5h18M16 15.5h1.5M6 6.5l8.5-3 1.5 3"/></svg><span class="nav-label">Money</span></a>
                <a href="#repos" class="nav-item" data-view="repos" data-key="r"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="5.5" r="2"/><circle cx="6" cy="18.5" r="2"/><circle cx="18" cy="8" r="2"/><path d="M6 7.5v9M18 10c0 4-6.5 3.5-11 7"/></svg><span class="nav-label">Repos</span></a>
                <a href="#habits" class="nav-item" data-view="habits" data-key="h"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21c-3.9 0-7-2.7-7-6.5 0-3.6 2.7-5.5 3.9-8.4.6 2 1.8 3 3.1 3.4.1-3.4 1.1-5.4 3.1-6.5.2 3.1 3.9 5.8 3.9 11.3 0 3.8-3.1 6.7-7 6.7z"/></svg><span class="nav-label">Habits</span></a>
                <a href="#goals" class="nav-item" data-view="goals" data-key="g"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.8"/><circle cx="12" cy="12" r="1.2"/></svg><span class="nav-label">Goals</span></a>
                <a href="#notes" class="nav-item" data-view="notes" data-key="n"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 3.5h8l4 4v11a2 2 0 0 1-2 2h-10a2 2 0 0 1-2-2v-13a2 2 0 0 1 2-2z"/><path d="M14 3.5V8h4.5M8.5 13h7M8.5 16.5h4.5"/></svg><span class="nav-label">Notes</span></a>
                <a href="#focus" class="nav-item" data-view="focus" data-key="f"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="7.5"/><path d="M12 9.5V13l2.5 2M9.5 2.8h5"/></svg><span class="nav-label">Focus</span></a>
                <a href="#insights" class="nav-item" data-view="insights" data-key="i"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 20.5h17M6.5 17v-5M10.5 17V6.5M14.5 17V9.5M18.5 17v-3"/></svg><span class="nav-label">Insights</span></a>
                <a href="#activity" class="nav-item" data-view="activity" data-key="a"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.8 12a8.2 8.2 0 1 0 2.4-5.8L3.8 8.5"/><path d="M3.8 4v4.5h4.5M12 7.5V12l3 2"/></svg><span class="nav-label">History</span></a>
                <a href="#settings" class="nav-item" data-view="settings" data-key="s"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6.5h9M17.5 6.5H20M4 12h3M11.5 12H20M4 17.5h11M19.5 17.5h.5"/><circle cx="15.5" cy="6.5" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17.5" cy="17.5" r="2"/></svg><span class="nav-label">Settings</span></a>
            </nav>
            <div class="sidebar-foot">
                <button class="btn btn-ghost nav-item" id="btn-palette" title="Press K (or Ctrl/Cmd+K)"
                        onclick="window.inphubPalette&&window.inphubPalette()"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg><span class="nav-label">Search</span><kbd>K</kbd></button>
            </div>
        </aside>
        <div class="nav-backdrop" id="nav-backdrop" hidden
             onclick="window.inphubDrawer&&window.inphubDrawer(false)"></div>

        <!-- Main -->
        <main class="main">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="btn btn-ghost btn-icon hamburger" id="btn-nav" aria-label="Open menu"
                            onclick="window.inphubDrawer&&window.inphubDrawer()"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
                    <div class="title-block">
                        <div id="greeting" class="greeting"></div>
                        <h1 id="page-title" class="page-title">Dashboard</h1>
                    </div>
                </div>
                <div class="topbar-right">
                    <div id="clock" class="clock"></div>
                    <button class="btn btn-ghost btn-icon" id="btn-theme" title="Toggle theme" aria-label="Toggle theme"
                            onclick="window.inphubToggleTheme&&window.inphubToggleTheme()"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button>
                </div>
            </header>

            <section id="view-dashboard" class="view" hidden aria-label="Dashboard"></section>
            <section id="view-todos" class="view" hidden aria-label="To-Do"></section>
            <section id="view-expenses" class="view" hidden aria-label="Money"></section>
            <section id="view-repos" class="view" hidden aria-label="Repos"></section>
            <section id="view-habits" class="view" hidden aria-label="Habits"></section>
            <section id="view-goals" class="view" hidden aria-label="Goals"></section>
            <section id="view-notes" class="view" hidden aria-label="Notes"></section>
            <section id="view-focus" class="view" hidden aria-label="Focus"></section>
            <section id="view-insights" class="view" hidden aria-label="Insights"></section>
            <section id="view-activity" class="view" hidden aria-label="History"></section>
            <section id="view-settings" class="view" hidden aria-label="Settings"></section>
        </main>
    </div>

    <!-- Command palette -->
    <div id="palette" class="palette" hidden></div>

    <!-- Toast host -->
    <div id="toasts" class="toasts" aria-live="polite"></div>

    <!-- A module link error (usually a half-cached bundle) otherwise fails in
         total silence: no view renders and no shortcut works. Say so out loud.
         Content-hashed filenames should make this impossible now, but a stale
         service worker can still serve a chunk that no longer matches. -->
    <script>
        window.addEventListener('error', function (e) {
            if (e && e.message && /module|import|export/i.test(e.message) && !window.__inphubLoaded) {
                var b = document.createElement('div');
                b.style.cssText = 'position:fixed;inset:auto 0 0 0;z-index:999;padding:12px 16px;'
                    + 'background:#ef4444;color:#fff;font:14px system-ui;text-align:center';
                b.textContent = 'inphub lite could not load its scripts. Hard-reload the page '
                    + '(Cmd/Ctrl+Shift+R), or open ?nosw=1 to clear the offline cache.';
                document.body.appendChild(b);
            }
        });
    </script>
    <script type="module" src="assets/js/app-2OSQWYZ2.js"></script>
</body>
</html>
